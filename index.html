    <!-- Script normale (non Babel) per SQLite - async/await funziona nativamente -->
    <script>
        // ============ FUNZIONI SQLite IMPORT ============
        window.readSQLiteDatabase = async function(file) {
            let SQL;
            try {
                SQL = await initSqlJs({
                    locateFile: function(f) { return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + f; }
                });
            } catch(e1) {
                console.warn('CDN principale fallito, provo fallback...', e1);
                try {
                    SQL = await initSqlJs({
                        locateFile: function(f) { return 'https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/' + f; }
                    });
                } catch(e2) {
                    throw new Error('Impossibile caricare sql.js. Controlla la connessione internet.\n' + e2.message);
                }
            }
            const arrayBuffer = await file.arrayBuffer();
            const uint8Array = new Uint8Array(arrayBuffer);
            const magic = String.fromCharCode(uint8Array[0], uint8Array[1], uint8Array[2], uint8Array[3], uint8Array[4], uint8Array[5]);
            if (magic !== 'SQLite') {
                throw new Error('Il file non sembra un database SQLite valido.\nPrimi bytes: "' + magic + '"\nAssicurati di selezionare il file backup corretto.');
            }
            return new SQL.Database(uint8Array);
        };

        window.queryDB = function(db, sql) {
            var results = [];
            try {
                var stmt = db.prepare(sql);
                while (stmt.step()) {
                    results.push(stmt.getAsObject());
                }
                stmt.free();
            } catch(e) {
                console.warn('Query fallita:', sql, e);
            }
            return results;
        };

        window.import1MoneyDB = async function(file) {
            var db = await window.readSQLiteDatabase(file);

            var tables = window.queryDB(db, "SELECT name FROM sqlite_master WHERE type='table'");
            console.log('Tabelle trovate:', tables.map(function(t) { return t.name; }));

            var rawCategories = window.queryDB(db, "SELECT * FROM de");
            console.log('Categorie trovate:', rawCategories.length);
            if (rawCategories.length > 0) console.log('Colonne DE:', Object.keys(rawCategories[0]));

            var rawAccounts = window.queryDB(db, "SELECT * FROM ta");
            console.log('Conti trovati:', rawAccounts.length);
            if (rawAccounts.length > 0) console.log('Colonne TA:', Object.keys(rawAccounts[0]));

            var rawTransactions = window.queryDB(db, "SELECT * FROM tr");
            console.log('Transazioni trovate:', rawTransactions.length);
            if (rawTransactions.length > 0) console.log('Colonne TR:', Object.keys(rawTransactions[0]));

            var COLORS = ['#FF6B6B','#4ECDC4','#4DA6FF','#95E1D3','#AA96DA','#FFD93D','#FF8E8E','#5ED5D5','#3D8BFF','#FCBAD3','#FFF176','#A8D8EA','#8D6E63','#CE93D8','#FFB74D','#B0BEC5','#6BCF7F','#4CAF50','#8BC34A','#9CCC65','#AED581','#C5E1A5','#F06292','#BA68C8','#64B5F6','#4DB6AC','#81C784','#FF8A65','#A1887F'];
            var ACC_COLORS = ['#4CAF50','#2196F3','#FF9800','#E91E63','#9C27B0','#00BCD4','#FF5722','#607D8B','#795548','#FFC107','#009688','#673AB7','#3F51B5','#FF4081'];

            // Processa categorie
            var catExpense = [];
            var catIncome = [];
            var catMap = {};

            rawCategories.forEach(function(row, idx) {
                var id = row._id !== undefined ? row._id : idx;
                var name = row._na || row.name || row._n || ('Categoria ' + id);
                var type = (row._ty === 1 || row._ty === '1') ? 'income' : 'expense';
                var color = COLORS[idx % COLORS.length];
                var icon = type === 'income' ? '💰' : '📦';
                var catObj = { id: 'imported_cat_' + id, name: String(name), icon: icon, color: color };
                catMap[id] = Object.assign({}, catObj, { type: type });
                if (type === 'expense') catExpense.push(catObj);
                else catIncome.push(catObj);
            });

            // Processa conti
            var accountMap = {};
            var customAccounts = [];

            if (rawAccounts.length > 0) {
                rawAccounts.forEach(function(row, idx) {
                    var id = row._id !== undefined ? row._id : idx;
                    var name = row._na || row.name || row._n || ('Conto ' + id);
                    var color = ACC_COLORS[idx % ACC_COLORS.length];
                    var slug = 'acc_' + String(name).toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + id;
                    accountMap[id] = slug;
                    customAccounts.push({ id: slug, name: String(name), icon: '🏦', color: color });
                });
            } else {
                var accIds = {};
                rawTransactions.forEach(function(t) {
                    var aid = t._a_i !== undefined ? t._a_i : (t._ai !== undefined ? t._ai : t.account_id);
                    if (aid !== undefined && aid !== null) accIds[aid] = true;
                });
                var idx = 0;
                Object.keys(accIds).forEach(function(aid) {
                    var slug = 'acc_imported_' + aid;
                    accountMap[aid] = slug;
                    customAccounts.push({ id: slug, name: 'Conto ' + aid, icon: '🏦', color: ACC_COLORS[idx % ACC_COLORS.length] });
                    idx++;
                });
            }

            // Processa transazioni
            var transactions = [];
            var skipped = 0;
            var baseTime = Date.now();

            rawTransactions.forEach(function(row, idx) {
                try {
                    var ty = parseInt(row._ty || row.ty || 0);
                    if (ty === 2) { skipped++; return; }

                    var type = ty === 1 ? 'income' : 'expense';
                    var tsMs = parseInt(row._da || row._d || row.date || 0);
                    var dateObj = tsMs > 0 ? new Date(tsMs) : new Date();
                    var amount = Math.abs(parseFloat(row._a_m || row._am || row.amount || 0));
                    var catId = row._c_i !== undefined ? row._c_i : (row._ci !== undefined ? row._ci : row.cat_id);
                    var catInfo = catMap[catId];
                    var categoryId = catInfo ? catInfo.id : 'other';
                    var accId = row._a_i !== undefined ? row._a_i : (row._ai !== undefined ? row._ai : row.account_id);
                    var accountSlug = accountMap[accId] || 'cash';
                    var note = row._co || row._note || row.note || row._n || '';

                    transactions.push({
                        id: baseTime + idx,
                        type: type,
                        amount: amount,
                        category: categoryId,
                        account: accountSlug,
                        note: String(note || ''),
                        date: dateObj.toISOString(),
                        importedFrom1Money: true
                    });
                } catch(err) {
                    console.error('Errore transazione', idx, err);
                    skipped++;
                }
            });

            db.close();

            return {
                categories: { expense: catExpense, income: catIncome },
                customAccounts: customAccounts,
                transactions: transactions,
                skipped: skipped,
                stats: {
                    categories: rawCategories.length,
                    accounts: customAccounts.length,
                    transactions: transactions.length,
                    skipped: skipped
                }
            };
        };
    </script>

    <!-- IndexedDB per transazioni (nessun limite di spazio) -->
    <script>
        window.MT_DB = null;
        window.MT_DB_READY = false;
        window.MT_DB_CALLBACKS = [];

        function openMTDatabase() {
            var req = indexedDB.open('MoneyTracker6', 2);
            req.onupgradeneeded = function(e) {
                var db = e.target.result;
                // Versione 1: indice sbagliato su 'account' (confondeva profilo con conto bancario)
                if (db.objectStoreNames.contains('transactions')) {
                    db.deleteObjectStore('transactions');
                }
                // Versione 2: indice su '_profileId' separato dal campo 'account' (conto bancario)
                var store = db.createObjectStore('transactions', { keyPath: 'id' });
                store.createIndex('_profileId', '_profileId', { unique: false });
            };
            req.onsuccess = function(e) {
                window.MT_DB = e.target.result;
                window.MT_DB_READY = true;
                window.MT_DB_CALLBACKS.forEach(function(cb) { cb(); });
                window.MT_DB_CALLBACKS = [];
                console.log('IndexedDB pronto (v2)');
            };
            req.onerror = function(e) {
                console.error('IndexedDB errore:', e.target.error);
            };
        }
        openMTDatabase();

        function onDBReady(cb) {
            if (window.MT_DB_READY) cb();
            else window.MT_DB_CALLBACKS.push(cb);
        }

        // Salva array transazioni per un account (profilo)
        window.saveTransactionsToDB = function(profileId, transactions) {
            return new Promise(function(resolve, reject) {
                onDBReady(function() {
                    var db = window.MT_DB;
                    var tx = db.transaction('transactions', 'readwrite');
                    var store = tx.objectStore('transactions');
                    // Prima cancella vecchie transazioni di questo profilo
                    var idx = store.index('_profileId');
                    var req = idx.openCursor(IDBKeyRange.only(profileId));
                    var toDelete = [];
                    req.onsuccess = function(e) {
                        var cursor = e.target.result;
                        if (cursor) { toDelete.push(cursor.primaryKey); cursor.continue(); }
                        else {
                            toDelete.forEach(function(k) { store.delete(k); });
                            // Poi inserisci nuove - NON sovrascrivere il campo 'account' (conto bancario)
                            transactions.forEach(function(t) {
                                var obj = Object.assign({}, t);
                                obj._profileId = profileId; // campo separato per indicizzazione
                                store.put(obj);
                            });
                        }
                    };
                    tx.oncomplete = function() { resolve(); };
                    tx.onerror = function(e) { reject(e.target.error); };
                });
            });
        };

        // Carica transazioni per un profilo
        window.loadTransactionsFromDB = function(profileId) {
            return new Promise(function(resolve, reject) {

            // IMPORT DA 1MONEY CSV - versione completa senza perdita dati
            const import1MoneyCSV = (csvText) => {
                try {
                    const lines = csvText.split('\n').filter(line => line.trim());
                    if (lines.length < 2) throw new Error('File CSV vuoto o non valido');

                    // Leggi categorie e conti esistenti
                    const existingCats = getCategoriesFromStorage();
                    const existingAccs = getCustomTransactionAccounts();
                    const newExpenseCats = [];
                    const newIncomeCats = [];
                    const newAccounts = [];

                    // Mappe per lookup rapido nome→id
                    const catExpenseMap = {}; // nome → id
                    const catIncomeMap  = {};
                    const accMap        = {}; // nome → id
                    existingCats.expense.forEach(c => { catExpenseMap[c.name.toLowerCase()] = c.id; });
                    existingCats.income.forEach(c =>  { catIncomeMap[c.name.toLowerCase()]  = c.id; });
                    [...getAccountsFilter()].forEach(a => { accMap[a.name.toLowerCase()] = a.id; });

                    const COLORS = ['#FF6B6B','#4ECDC4','#4DA6FF','#AA96DA','#FFD93D','#95E1D3','#F06292','#BA68C8','#64B5F6','#4DB6AC','#81C784','#FF8A65','#A1887F','#90A4AE','#FFB74D','#AED581','#4CAF50','#FF9800','#E91E63','#9C27B0'];
                    const ACC_COLORS = ['#4CAF50','#2196F3','#FF9800','#E91E63','#9C27B0','#00BCD4','#FF5722','#607D8B','#795548','#FFC107'];
                    let colorIdx = 0;
                    let accColorIdx = 0;

                    // Funzione: trova o crea categoria
                    const getOrCreateCategory = (name, type) => {
                        if (!name || name.trim() === '') return 'other';
                        const key = name.trim().toLowerCase();
                        const map = type === 'income' ? catIncomeMap : catExpenseMap;
                        if (map[key]) return map[key];
                        // Crea nuova categoria
                        const id = 'cat_' + key.replace(/[^a-z0-9]/g, '_') + '_' + Date.now();
                        const icon = type === 'income' ? '💰' : '📦';
                        const color = COLORS[colorIdx++ % COLORS.length];
                        const catObj = { id, name: name.trim(), icon, color, archived: false };
                        map[key] = id;
                        if (type === 'income') newIncomeCats.push(catObj);
                        else newExpenseCats.push(catObj);
                        return id;
                    };

                    // Funzione: trova o crea conto
                    const getOrCreateAccount = (name) => {
                        if (!name || name.trim() === '') return 'cash';
                        const key = name.trim().toLowerCase();
                        if (accMap[key]) return accMap[key];
                        // Crea nuovo conto
                        const id = 'acc_' + key.replace(/[^a-z0-9]/g, '_') + '_' + Date.now();
                        const color = ACC_COLORS[accColorIdx++ % ACC_COLORS.length];
                        const accObj = { id, name: name.trim(), icon: '🏦', color };
                        accMap[key] = id;
                        newAccounts.push(accObj);
                        return id;
                    };

                    const importedTransactions = [];
                    const skippedCount = { trasferimenti: 0, errori: 0 };

                    for (let i = 1; i < lines.length; i++) {
                        try {
                            // Parse CSV robusto (gestisce virgole dentro virgolette)
                            const fields = [];
                            let current = '';
                            let inQuotes = false;
                            const raw = lines[i];
                            for (let j = 0; j < raw.length; j++) {
                                const ch = raw[j];
                                if (ch === '"') {
                                    if (inQuotes && raw[j+1] === '"') { current += '"'; j++; }
                                    else inQuotes = !inQuotes;
                                } else if (ch === ',' && !inQuotes) {
                                    fields.push(current.trim());
                                    current = '';
                                } else {
                                    current += ch;
                                }
                            }
                            fields.push(current.trim());

                            if (fields.length < 5) continue;

                            // Colonne 1Money CSV: Data, Tipologia, Dal conto, Al conto/Categoria, Importo, Valuta, Tasso, Conto2, Tag, Note
                            const data             = fields[0] || '';
                            const tipologia        = fields[1] || '';
                            const dalConto         = fields[2] || '';
                            const alContoCategoria = fields[3] || '';
                            const importo          = fields[4] || '0';
                            const tagRaw           = fields[8] || '';
                            const note             = fields[9] || fields[7] || '';

                            // Salta trasferimenti
                            if (tipologia === 'Trasferimento' || tipologia.toLowerCase().includes('transfer')) {
                                skippedCount.trasferimenti++;
                                continue;
                            }

                            // Parse data (gg/mm/aa o gg/mm/aaaa)
                            let dateObj = new Date();
                            const dateParts = data.split('/');
                            if (dateParts.length === 3) {
                                const giorno = parseInt(dateParts[0]);
                                const mese   = parseInt(dateParts[1]) - 1;
                                const anno   = dateParts[2].length === 2 ? 2000 + parseInt(dateParts[2]) : parseInt(dateParts[2]);
                                dateObj = new Date(anno, mese, giorno);
                            }

                            // Tipo transazione
                            const type = tipologia === 'Entrata' ? 'income' : 'expense';

                            // Estrai categoria (prima delle parentesi) e sottocategoria (dentro parentesi)
                            const catMatch    = alContoCategoria.match(/^([^(]+)/);
                            const catName     = catMatch ? catMatch[1].trim() : alContoCategoria.trim();
                            const subCatMatch = alContoCategoria.match(/\(([^)]+)\)/);
                            const subCat      = subCatMatch ? subCatMatch[1].trim() : '';

                            // Trova o crea categoria
                            const categoryId = getOrCreateCategory(catName, type);

                            // Trova o crea conto
                            const accountId = getOrCreateAccount(dalConto);

                            // Nota: combina sottocategoria + nota originale
                            let finalNote = note || '';
                            if (subCat && subCat.toLowerCase() !== catName.toLowerCase()) {
                                finalNote = subCat + (finalNote ? ' · ' + finalNote : '');
                            }

                            // Tag: possono essere separati da virgola o punto e virgola
                            const tagIds = [];
                            if (tagRaw.trim()) {
                                const tagNames = tagRaw.split(/[,;]/).map(t => t.trim()).filter(Boolean);
                                tagNames.forEach(tagName => {
                                    const tagId = getOrCreateTag(tagName);
                                    if (tagId) tagIds.push(tagId);
                                });
                            }

                            // Importo
                            const amount = Math.abs(parseFloat(importo.replace(',', '.')) || 0);
                            if (amount === 0) continue;

                            importedTransactions.push({
                                id: Date.now() + i + Math.random(),
                                type,
                                amount,
                                category: categoryId,
                                account: accountId,
                                note: finalNote,
                                date: dateObj.toISOString(),
                                tags: tagIds
                            });

                        } catch (err) {
                            console.error('Errore riga', i, err);
                            skippedCount.errori++;
                        }
                    }

                    // Salva nuove categorie
                    if (newExpenseCats.length > 0 || newIncomeCats.length > 0) {
                        saveCategoriestoStorage({
                            expense: [...existingCats.expense, ...newExpenseCats],
                            income:  [...existingCats.income,  ...newIncomeCats]
                        });
                    }

                    // Salva nuovi conti
                    if (newAccounts.length > 0) {
                        saveCustomTransactionAccounts([...existingAccs, ...newAccounts]);
                    }

                    // Aggiungi transazioni (più recenti prima)
                    importedTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
                    setTransactions(prev => [...importedTransactions, ...prev]);

                    return {
                        success: true,
                        imported: importedTransactions.length,
                        newCategories: newExpenseCats.length + newIncomeCats.length,
                        newAccounts: newAccounts.length,
                        skipped: skippedCount
                    };

                } catch (error) {
                    console.error('Errore import CSV:', error);
                    return { success: false, error: error.message };
                }
            };

                        const expense = periodTransactions
                            .filter(t => t.type === 'expense')

            const [accMenu, setAccMenu] = React.useState(null); // {acc, x, y}
            const accPressTimer = React.useRef(null);
            const accLongPressed = React.useRef(false);
            const accPressPos = React.useRef({ x: 0, y: 0 });
            const [accSortMode, setAccSortMode] = React.useState(false);

            const TIPOLOGIE = [
                { id: 'normale', label: 'Normale', icon: '🏦' },
                { id: 'risparmio', label: 'Risparmio', icon: '🐷' },
                { id: 'carta', label: 'Carta', icon: '💳' },
                { id: 'contanti', label: 'Contanti', icon: '💵' },
                { id: 'investimento', label: 'Investimento', icon: '📈' },
                { id: 'debito', label: 'Debito', icon: '⚠️' },
            ];

            const reload = () => setAccs([...getCustomTransactionAccounts()]);

            // Ricarica i conti ogni volta che cambia il profilo attivo
            React.useEffect(() => { reload(); }, [activeProfileId]);

            // Calcola saldo per ogni conto
            const getSaldo = (accId) => {
                return transactions
                    .filter(t => t.account === accId)
                    .reduce((sum, t) => sum + (t.type === 'income' ? t.amount : -t.amount), 0);
            };

            // Saldo totale (solo conti inclusi nel totale, non archiviati)
            const totaleSaldo = accs
                .filter(a => !a.archived && a.includeInTotal !== false)
                .reduce((sum, a) => sum + getSaldo(a.id), 0);

            const activeAccs = accs
                .filter(a => !a.archived)
                .sort((a, b) => (a.order || 999) - (b.order || 999));
            const archivedAccs = accs.filter(a => a.archived);

            // Raggruppa per tipologia
            const byTipologia = {};
            TIPOLOGIE.forEach(t => { byTipologia[t.id] = []; });
            activeAccs.forEach(a => {
                const tip = a.tipologia || 'normale';
                if (!byTipologia[tip]) byTipologia[tip] = [];
                byTipologia[tip].push(a);
            });

            // Drag desktop
            const handleDragStart = (e, id) => { setDraggedId(id); e.dataTransfer.effectAllowed = 'move'; };
            const handleDragOver = (e, id) => { e.preventDefault(); setDragOverId(id); };
            const handleDrop = (e, targetId) => {
                e.preventDefault();
                if (!draggedId || draggedId === targetId) { setDraggedId(null); setDragOverId(null); return; }
                const all = getCustomTransactionAccounts();
                const from = all.findIndex(a => a.id === draggedId);
                const to = all.findIndex(a => a.id === targetId);
                if (from < 0 || to < 0) return;
                const newOrder = [...all];
                const [removed] = newOrder.splice(from, 1);
                newOrder.splice(to, 0, removed);
                newOrder.forEach((a, i) => { a.order = i; });
                saveCustomTransactionAccounts(newOrder);
                reload();
                setDraggedId(null); setDragOverId(null);
            };
            // Touch drag
            const handleTouchStart = (e, id) => { touchDrag.current = { active: true, id }; };
            const handleTouchMove = (e) => {
                if (!touchDrag.current.active) return;
                e.preventDefault();
                const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
                const card = el && el.closest('[data-accid]');
                if (card) setDragOverId(card.dataset.accid);
            };
            const handleTouchEnd = () => {
                if (touchDrag.current.active && dragOverId && touchDrag.current.id !== dragOverId) {
                    const all = getCustomTransactionAccounts();
                    const from = all.findIndex(a => a.id === touchDrag.current.id);
                    const to = all.findIndex(a => a.id === dragOverId);
                    if (from >= 0 && to >= 0) {
                        const newOrder = [...all];
                        const [removed] = newOrder.splice(from, 1);
                        newOrder.splice(to, 0, removed);
                        newOrder.forEach((a, i) => { a.order = i; });
                        saveCustomTransactionAccounts(newOrder);
                        reload();
                    }
                }
                touchDrag.current = { active: false, id: null };
                setDraggedId(null); setDragOverId(null);
            };

            const renderAccCard = (acc) => {
                const saldo = getSaldo(acc.id);
                const isDragging = draggedId === acc.id;
                const isOver = dragOverId === acc.id && !isDragging;
                return (
                    <div
                        key={acc.id}
                        data-accid={acc.id}
                        onClick={(e) => {
                            if (accSortMode) return;
                            const rect = e.currentTarget.getBoundingClientRect();
                            setAccMenu({ acc, x: rect.left + rect.width / 2, y: rect.bottom + 5 });
                        }}
                        onTouchStart={(e) => {
                            if (accSortMode) { handleTouchStart(e, acc.id); return; }
                            accPressPos.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                        }}
                        onTouchMove={(e) => {
                            if (accSortMode) { handleTouchMove(e); return; }
                            const t = e.touches[0];
                            if (Math.abs(t.clientX - accPressPos.current.x) > 8 || Math.abs(t.clientY - accPressPos.current.y) > 8) {
                                accLongPressed.current = true; // considera scroll, non tap
                            }
                        }}
                        onTouchEnd={(e) => {
                            if (accSortMode) { handleTouchEnd(e); return; }
                        }}
                        style={{
                            background: 'white',
                            borderRadius: '14px',
                            padding: '14px 16px',
                            marginBottom: '10px',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '14px',
                            boxShadow: '0 2px 8px rgba(0,0,0,0.07)',
                            border: isOver ? '2px dashed #667eea' : '2px solid transparent',
                            transform: isOver ? 'scale(1.02)' : isDragging ? 'scale(0.97)' : 'scale(1)',
                            opacity: isDragging ? 0.4 : 1,
                            cursor: 'pointer',
                            transition: 'transform 0.15s, opacity 0.15s',
                            userSelect: 'none'
                        }}
                    >
                        <div style={{
                            width: '46px', height: '46px', borderRadius: '12px',
                            background: acc.color || '#667eea',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            fontSize: '22px', flexShrink: 0
                        }}>{acc.icon || '🏦'}</div>
                        <div style={{ flex: 1 }}>
                            <div style={{ fontWeight: 'bold', fontSize: '15px' }}>{acc.name}</div>
                            <div style={{ fontSize: '11px', color: '#999', marginTop: '2px' }}>
                                {TIPOLOGIE.find(t => t.id === (acc.tipologia || 'normale'))?.label || 'Normale'}
                            </div>
                        </div>
                        <div style={{ textAlign: 'right' }}>
                            <div style={{ fontWeight: 'bold', fontSize: '16px', color: saldo >= 0 ? '#4CAF50' : '#f44336' }}>
                                {saldo >= 0 ? '' : '-'}€ {Math.abs(saldo).toFixed(2)}
                            </div>
                        </div>
                    </div>
                );
            };

            // Menu contestuale conto
            const AccContextMenu = () => {
                if (!accMenu) return null;
                const { acc, x, y } = accMenu;
                React.useEffect(() => {
                    const close = () => setAccMenu(null);
                    setTimeout(() => document.addEventListener('click', close), 0);
                    return () => document.removeEventListener('click', close);
                }, []);
                const menuBtn = (onClick, icon, label) => (
                    <button onClick={onClick} style={{ width:'100%', padding:'12px 16px', border:'none', background:'none', textAlign:'left', cursor:'pointer', display:'flex', alignItems:'center', gap:'12px', fontSize:'14px', transition:'background 0.2s' }}
                        onMouseOver={(e) => e.currentTarget.style.background='#f5f5f5'}
                        onMouseOut={(e) => e.currentTarget.style.background='none'}>
                        <span style={{fontSize:'18px'}}>{icon}</span><span>{label}</span>
                    </button>
                );
                return (
                    <div style={{ position:'fixed', top:y+'px', left:x+'px', transform:'translateX(-50%)', background:'white', borderRadius:'12px', boxShadow:'0 4px 20px rgba(0,0,0,0.25)', zIndex:10000, minWidth:'200px', overflow:'hidden', animation:'menuAppear 0.2s ease-out' }}
                        onClick={(e) => e.stopPropagation()}>
                        <div style={{ padding:'12px 16px', borderBottom:'1px solid #f0f0f0', background:(acc.color||'#667eea')+'20', display:'flex', alignItems:'center', gap:'10px' }}>
                            <span style={{fontSize:'24px'}}>{acc.icon||'🏦'}</span>
                            <span style={{fontWeight:'bold', color:acc.color||'#667eea'}}>{acc.name}</span>
                        </div>
                        <div style={{padding:'8px 0'}}>
                            {menuBtn(() => { setAccMenu(null); onAddMovementForAccount && onAddMovementForAccount(acc.id); }, '➕', 'Aggiungi movimento')}
                            {menuBtn(() => { setAccMenu(null); onViewMovementsForAccount && onViewMovementsForAccount(acc.id); }, '📋', 'Movimenti')}
                            {menuBtn(() => { setAccMenu(null); setEditingAcc(acc); }, '✏️', 'Modifica conto')}
                            {menuBtn(() => { setAccMenu(null); setSelectedAcc(acc); setShowAdjust(true); }, '⚖️', 'Aggiusta saldo')}
                            {menuBtn(() => { setAccMenu(null); setAccSortMode(true); }, '↕️', 'Sposta (riordina)')}
                        </div>
                    </div>
                );
            };

            // Modal dettaglio conto
            const AccDetailModal = () => {
                const [adjustAmt, setAdjustAmt] = React.useState('');
                const [adjustNote, setAdjustNote] = React.useState('');
                const [tab, setTab] = React.useState('detail'); // detail | adjust | edit
                const [editName, setEditName] = React.useState(selectedAcc?.name || '');
                const [editTip, setEditTip] = React.useState(selectedAcc?.tipologia || 'normale');
                const [editInclude, setEditInclude] = React.useState(selectedAcc?.includeInTotal !== false);
                const saldo = getSaldo(selectedAcc?.id);
                const accTx = transactions.filter(t => t.account === selectedAcc?.id)
                    .sort((a, b) => new Date(b.date) - new Date(a.date))
                    .slice(0, 20);

                const saveEdit = () => {
                    const all = getCustomTransactionAccounts();
                    const updated = all.map(a => a.id === selectedAcc.id
                        ? { ...a, name: editName, tipologia: editTip, includeInTotal: editInclude }
                        : a
                    );
                    saveCustomTransactionAccounts(updated);
                    reload();
                    setSelectedAcc(null);
                };

                const archiveAcc = () => {
                    if (!window.confirm(`Archiviare il conto "${selectedAcc.name}"?`)) return;
                    const all = getCustomTransactionAccounts();
                    const updated = all.map(a => a.id === selectedAcc.id ? { ...a, archived: true } : a);
                    saveCustomTransactionAccounts(updated);
                    reload();
                    setSelectedAcc(null);
                };

                const doAdjust = () => {
                    const amt = parseFloat(adjustAmt);
                    if (isNaN(amt) || amt === 0) return;
                    const diff = amt - saldo;
                    onAdjustBalance(selectedAcc.id, diff, adjustNote || '⚖️ Aggiustamento saldo');
                    setSelectedAcc(null);
                };

                return (
                    <div className="modal" onClick={() => setSelectedAcc(null)}>
                        <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxHeight: '90vh', overflow: 'auto' }}>
                            {/* Header colorato */}
                            <div style={{
                                background: selectedAcc?.color || '#667eea',
                                borderRadius: '12px 12px 0 0',
                                padding: '20px',
                                display: 'flex', alignItems: 'center', gap: '14px',
                                marginTop: '-1px'
                            }}>
                                <div style={{ fontSize: '32px' }}>{selectedAcc?.icon || '🏦'}</div>
                                <div style={{ flex: 1 }}>
                                    <div style={{ color: 'white', fontWeight: 'bold', fontSize: '20px' }}>{selectedAcc?.name}</div>
                                    <div style={{ color: 'rgba(255,255,255,0.8)', fontSize: '12px' }}>Saldo del conto</div>
                                    <div style={{ color: 'white', fontWeight: 'bold', fontSize: '22px' }}>
                                        {saldo >= 0 ? '' : '-'}€ {Math.abs(saldo).toFixed(2)}
                                    </div>
                                </div>
                                <button onClick={() => setSelectedAcc(null)} style={{ background: 'rgba(255,255,255,0.3)', border: 'none', borderRadius: '50%', width: '32px', height: '32px', cursor: 'pointer', color: 'white', fontSize: '18px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>×</button>
                            </div>

                            {/* Tab bar */}
                            <div style={{ display: 'flex', borderBottom: '1px solid #eee' }}>
                                {[['detail','📋 Dettaglio'],['adjust','⚖️ Bilancio'],['edit','✏️ Modifica']].map(([id, label]) => (
                                    <button key={id} onClick={() => setTab(id)} style={{
                                        flex: 1, padding: '12px 0', border: 'none', background: 'none',
                                        fontWeight: tab === id ? 'bold' : 'normal',
                                        color: tab === id ? '#667eea' : '#666',
                                        borderBottom: tab === id ? '2px solid #667eea' : '2px solid transparent',
                                        cursor: 'pointer', fontSize: '12px'
                                    }}>{label}</button>
                                ))}
                            </div>

                            <div style={{ padding: '16px' }}>
                                {tab === 'detail' && (
                                    <div>
                                        <div style={{ fontSize: '13px', color: '#666', marginBottom: '12px' }}>Ultimi movimenti</div>
                                        {accTx.length === 0 && <div style={{ color: '#999', textAlign: 'center', padding: '20px' }}>Nessun movimento</div>}
                                        {accTx.map(t => {
                                            const cats = getCategoriesFromStorage();
                                            const cat = (cats[t.type] || []).find(c => c.id === t.category) || { name: 'Altro', icon: '📦', color: '#999' };
                                            return (
                                                <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 0', borderBottom: '1px solid #f5f5f5' }}>
                                                    <div style={{ width: '34px', height: '34px', borderRadius: '8px', background: cat.color + '20', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '16px' }}>{cat.icon}</div>
                                                    <div style={{ flex: 1 }}>
                                                        <div style={{ fontSize: '13px', fontWeight: '500' }}>{cat.name}</div>
                                                        <div style={{ fontSize: '11px', color: '#999' }}>{new Date(t.date).toLocaleDateString('it-IT')}{t.note ? ' · ' + t.note : ''}</div>
                                                    </div>
                                                    <div style={{ fontWeight: 'bold', color: t.type === 'income' ? '#4CAF50' : '#f44336', fontSize: '14px' }}>
                                                        {t.type === 'income' ? '+' : '-'}€{t.amount.toFixed(2)}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {tab === 'adjust' && (
                                    <div>
                                        <div style={{ background: '#f3f4f6', borderRadius: '10px', padding: '14px', marginBottom: '16px', textAlign: 'center' }}>
                                            <div style={{ fontSize: '12px', color: '#666' }}>Saldo attuale</div>
                                            <div style={{ fontSize: '22px', fontWeight: 'bold', color: saldo >= 0 ? '#4CAF50' : '#f44336' }}>€ {saldo.toFixed(2)}</div>
                                        </div>
                                        <div style={{ marginBottom: '12px' }}>
                                            <label style={{ fontSize: '13px', color: '#666', display: 'block', marginBottom: '6px' }}>Nuovo saldo corretto</label>
                                            <input
                                                type="number"
                                                step="0.01"
                                                className="form-input"
                                                value={adjustAmt}
                                                onChange={e => setAdjustAmt(e.target.value)}
                                                placeholder={saldo.toFixed(2)}
                                            />
                                        </div>
                                        <div style={{ marginBottom: '16px' }}>
                                            <label style={{ fontSize: '13px', color: '#666', display: 'block', marginBottom: '6px' }}>Nota (opzionale)</label>
                                            <input type="text" className="form-input" value={adjustNote} onChange={e => setAdjustNote(e.target.value)} placeholder="es. Controllo estratto conto" />
                                        </div>
                                        {adjustAmt && !isNaN(parseFloat(adjustAmt)) && (
                                            <div style={{ background: '#e8f5e9', borderRadius: '8px', padding: '10px', marginBottom: '12px', fontSize: '13px', color: '#2e7d32', textAlign: 'center' }}>
                                                Verrà creato un movimento di{' '}
                                                <strong>{parseFloat(adjustAmt) - saldo >= 0 ? '+' : ''}€{(parseFloat(adjustAmt) - saldo).toFixed(2)}</strong>
                                            </div>
                                        )}
                                        <button onClick={doAdjust} style={{ width: '100%', padding: '12px', background: '#667eea', color: 'white', border: 'none', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer', fontSize: '15px' }}>
                                            ⚖️ Applica correzione
                                        </button>
                                    </div>
                                )}

                                {tab === 'edit' && (
                                    <div>
                                        <div style={{ marginBottom: '12px' }}>
                                            <label style={{ fontSize: '13px', color: '#666', display: 'block', marginBottom: '6px' }}>Nome conto</label>
                                            <input type="text" className="form-input" value={editName} onChange={e => setEditName(e.target.value)} />
                                        </div>
                                        <div style={{ marginBottom: '12px' }}>
                                            <label style={{ fontSize: '13px', color: '#666', display: 'block', marginBottom: '8px' }}>Tipologia</label>
                                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px' }}>
                                                {TIPOLOGIE.map(tip => (
                                                    <button key={tip.id} type="button" onClick={() => setEditTip(tip.id)} style={{
                                                        padding: '8px', border: '2px solid ' + (editTip === tip.id ? '#667eea' : '#e0e0e0'),
                                                        borderRadius: '8px', background: editTip === tip.id ? '#667eea15' : 'white',
                                                        cursor: 'pointer', fontSize: '12px', color: editTip === tip.id ? '#667eea' : '#333',
                                                        fontWeight: editTip === tip.id ? 'bold' : 'normal'
                                                    }}>
                                                        {tip.icon} {tip.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 0', borderTop: '1px solid #eee', borderBottom: '1px solid #eee', marginBottom: '16px' }}>
                                            <span style={{ fontSize: '14px' }}>Includi nel saldo totale</span>
                                            <button type="button" onClick={() => setEditInclude(!editInclude)} style={{
                                                width: '48px', height: '26px', borderRadius: '13px', border: 'none',
                                                background: editInclude ? '#667eea' : '#ccc', cursor: 'pointer', position: 'relative', transition: 'background 0.2s'
                                            }}>
                                                <div style={{ width: '20px', height: '20px', borderRadius: '50%', background: 'white', position: 'absolute', top: '3px', left: editInclude ? '25px' : '3px', transition: 'left 0.2s' }} />
                                            </button>
                                        </div>
                                        <button onClick={saveEdit} style={{ width: '100%', padding: '12px', background: '#667eea', color: 'white', border: 'none', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '10px', fontSize: '15px' }}>
                                            💾 Salva modifiche
                                        </button>
                                        <button onClick={archiveAcc} style={{ width: '100%', padding: '10px', background: 'white', color: '#FF9800', border: '2px solid #FF9800', borderRadius: '10px', fontWeight: 'bold', cursor: 'pointer', fontSize: '14px' }}>
                                            📦 Archivia conto
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div style={{ padding: '10px', paddingBottom: '80px' }}>
                    {/* Saldo totale */}
                    <div style={{
                        background: 'linear-gradient(135deg, #667eea, #764ba2)',
                        borderRadius: '16px', padding: '20px', marginBottom: '16px', color: 'white', textAlign: 'center'
                    }}>
                        <div style={{ fontSize: '13px', opacity: 0.85 }}>Saldo Totale Conti</div>
                        <div style={{ fontSize: '32px', fontWeight: 'bold' }}>
                            {totaleSaldo >= 0 ? '' : '-'}€ {Math.abs(totaleSaldo).toFixed(2)}
                        </div>
                        <div style={{ fontSize: '11px', opacity: 0.7, marginTop: '4px' }}>
                            {activeAccs.filter(a => a.includeInTotal !== false).length} conti inclusi
                        </div>
                    </div>

                    {/* Barra modalità riordino conti */}
                    {accSortMode && (
                        <div style={{ margin: '0 0 10px', padding: '10px 16px', background: '#667eea', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', color: 'white', fontSize: '13px' }}>
                            <span>✋ Trascina per riordinare</span>
                            <button onClick={() => setAccSortMode(false)} style={{ background: 'white', color: '#667eea', border: 'none', borderRadius: '6px', padding: '4px 10px', fontWeight: 'bold', cursor: 'pointer', fontSize: '12px' }}>Fine</button>
                        </div>
                    )}

                    {/* Lista per tipologia */}
                    {TIPOLOGIE.map(tip => {
                        const tipAccs = byTipologia[tip.id] || [];
                        if (tipAccs.length === 0) return null;
                        return (
                            <div key={tip.id} style={{ marginBottom: '16px' }}>
                                <div style={{ fontSize: '12px', fontWeight: 'bold', color: '#999', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: '8px', paddingLeft: '4px' }}>
                                    {tip.icon} {tip.label}
                                </div>
                                {tipAccs.map(acc => renderAccCard(acc))}
                            </div>
                        );
                    })}

                    {activeAccs.length === 0 && (
                        <div style={{ textAlign: 'center', padding: '40px 20px', color: '#999' }}>
                            <div style={{ fontSize: '40px', marginBottom: '10px' }}>🏦</div>
                            <div>Nessun conto trovato</div>
                            <div style={{ fontSize: '12px', marginTop: '8px' }}>Importa un CSV o crea un conto dalle impostazioni</div>
                        </div>
                    )}

                    {/* Conti archiviati */}
                    {archivedAccs.length > 0 && (
                        <div style={{ marginTop: '10px' }}>
                            <button onClick={() => setShowArchived(!showArchived)} style={{
                                width: '100%', padding: '10px', background: '#f5f5f5', border: '1px solid #ddd',
                                borderRadius: '10px', cursor: 'pointer', fontSize: '13px', color: '#666',
                                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px'
                            }}>
                                📦 {archivedAccs.length} {archivedAccs.length === 1 ? 'conto archiviato' : 'conti archiviati'}
                                <span style={{ fontSize: '10px' }}>{showArchived ? '▲' : '▼'}</span>
                            </button>
                            {showArchived && archivedAccs.map(acc => {
                                const saldo = getSaldo(acc.id);
                                return (
                                    <div key={acc.id} style={{ background: '#f9f9f9', borderRadius: '12px', padding: '12px 16px', marginTop: '8px', display: 'flex', alignItems: 'center', gap: '12px', opacity: 0.6, border: '1px dashed #ccc' }}>
                                        <div style={{ fontSize: '22px' }}>{acc.icon || '🏦'}</div>
                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontWeight: 'bold', fontSize: '14px' }}>{acc.name}</div>
                                        </div>
                                        <div style={{ fontSize: '14px', color: saldo >= 0 ? '#4CAF50' : '#f44336' }}>€{saldo.toFixed(2)}</div>
                                        <button onClick={() => {
                                            const all = getCustomTransactionAccounts();
                                            const updated = all.map(a => a.id === acc.id ? { ...a, archived: false } : a);
                                            saveCustomTransactionAccounts(updated);
                                            reload();
                                        }} style={{ padding: '4px 10px', background: '#667eea', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontSize: '12px' }}>
                                            📤 Ripristina
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <div style={{ textAlign: 'center', fontSize: '11px', color: '#bbb', marginTop: '12px' }}>
                        Tocca un conto per dettagli · Trascina per riordinare
                    </div>

                    {selectedAcc && <AccDetailModal />}
                    <AccContextMenu />
                </div>
            );
        }

        function TransactionList({ transactions, onDelete, onEdit }) {
            const [editingTransaction, setEditingTransaction] = React.useState(null);

            const getCategoryInfo = (type, categoryId) => {
                const cats = getCategoriesFromStorage();
                const cat = (cats[type] || []).find(c => c.id === categoryId);
                if (cat) return cat;
                if (categoryId && categoryId.startsWith('imported_cat_')) {
                    return { name: categoryId.replace('imported_cat_', 'Cat.'), icon: '📦', color: '#B0BEC5' };
                }
                return { name: categoryId || 'Sconosciuto', icon: '❓', color: '#999' };
            };

            const getAccountInfo = (accountId) => {
                const allAccs = getAccountsFilter();
                const acc = allAccs.find(a => a.id === accountId);
                return acc || { name: accountId || 'Sconosciuto', icon: '❓' };
            };

            // Long-press logic
            const pressTimer = React.useRef(null);
            const pressStartPos = React.useRef({ x: 0, y: 0 });
            const didLongPress = React.useRef(false);

            const startPress = (e, transaction) => {
                didLongPress.current = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                pressStartPos.current = { x: clientX, y: clientY };
                pressTimer.current = setTimeout(() => {
                    didLongPress.current = true;
                    setEditingTransaction(transaction);
                    // Vibrazione feedback su mobile
                    if (navigator.vibrate) navigator.vibrate(40);
                }, 500);
            };

            const cancelPress = (e) => {
                if (pressTimer.current) {
                    clearTimeout(pressTimer.current);
                    pressTimer.current = null;
                }
            };

            const movePress = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = Math.abs(clientX - pressStartPos.current.x);
                const dy = Math.abs(clientY - pressStartPos.current.y);
                // Solo se si sta davvero scrollando (soglia più alta per mobile)
                if (dx > 15 || dy > 15) cancelPress();
            };

            const handleClick = (e) => {
                // Blocca il click normale se era un long-press
                if (didLongPress.current) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            };

            return (
                <>
                <ul className="transaction-list">
                    {transactions.map(transaction => {
                        const category = getCategoryInfo(transaction.type, transaction.category);
                        const account = getAccountInfo(transaction.account || 'cash');
                        return (
                            <li
                                key={transaction.id}
                                className="transaction-item"
                                onMouseDown={e => startPress(e, transaction)}
                                onMouseUp={cancelPress}
                                onMouseLeave={cancelPress}
                                onMouseMove={movePress}
                                onTouchStart={e => startPress(e, transaction)}
                                onTouchEnd={(e) => {
                                    if (didLongPress.current) {
                                        // Era long-press: blocca il click successivo
                                        e.preventDefault();
                                        e.stopPropagation();
                                        didLongPress.current = false;
                                    } else {
                                        // Era tap normale: cancella il timer
                                        cancelPress();
                                    }
                                }}
                                onTouchMove={movePress}
                                onClick={handleClick}
                                style={{ userSelect: 'none', WebkitUserSelect: 'none' }}
                            >
                                <div style={{ display: 'flex', alignItems: 'center', flex: 1 }}>
                                    <div 
                                        className="transaction-icon"
                                        style={{ backgroundColor: category.color + '20' }}
                                    >
                                        {category.icon}
                                    </div>
                                    <div className="transaction-info">
                                        <div className="transaction-category">{category.name}</div>
                                        <div className="transaction-date">
                                            {new Date(transaction.date).toLocaleDateString('it-IT')} • {account.icon} {account.name}
                                        </div>
                                        {transaction.note && (
                                            <div className="transaction-date">{transaction.note}</div>
                                        )}
                                        {transaction.tags && transaction.tags.length > 0 && (
                                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px', marginTop: '3px' }}>
                                                {transaction.tags.map(tagId => {
                                                    const tag = getTagsFromStorage().find(t => t.id === tagId);
                                                    if (!tag) return null;
                                                    return (
                                                        <span key={tagId} style={{
                                                            fontSize: '10px', padding: '1px 7px',
                                                            borderRadius: '10px', background: tag.color + '25',
                                                            color: tag.color, border: '1px solid ' + tag.color + '60',
                                                            fontWeight: 'bold'
                                                        }}>#{tag.name}</span>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <div>
                                    <div className={`transaction-amount ${transaction.type}`}>
                                        {transaction.type === 'income' ? '+' : '-'}€ {transaction.amount.toFixed(2)}
                                    </div>
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); onDelete(transaction.id); }}
                                        style={{
                                            background: 'none',
                                            border: 'none',
                                            color: '#f44336',
                                            cursor: 'pointer',
                                            fontSize: '12px',
                                            marginTop: '5px'
                                        }}
                                    >
                                        Elimina
                                    </button>
                                </div>
                            </li>
                        );
                    })}
                </ul>
                {editingTransaction && (
                    <EditTransactionModal
                        transaction={editingTransaction}
                        onClose={() => setEditingTransaction(null)}
                        onSave={(updated) => {

                            setEditingTransaction(null);
                        }}
                        onDelete={(id) => {
                            onDelete(id);
                            setEditingTransaction(null);
                        }}
                    />
                )}
                </>
            );
        }

		function CategoriesView({ expenses, budgets, onCategoryClick, onCategoryLongPress, sortMode, setSortMode, mode = 'expense', totalIncome = 0, totalExpense = 0 }) {
            const [categoryOrder, setCategoryOrder] = React.useState([]);
            const [draggedItem, setDraggedItem] = React.useState(null);
            const [dragOverItem, setDragOverItem] = React.useState(null);
            const [showArchived, setShowArchived] = React.useState(false);
            const [cats, setCats] = React.useState(getCategoriesFromStorage());
            // Touch drag state
            const touchDrag = React.useRef({ active: false, id: null, startY: 0, currentY: 0 });
            // Long press state
            const catPressTimer = React.useRef(null);
            const catLongPressed = React.useRef(false);
            const catPressPos = React.useRef({ x: 0, y: 0 });
            // Modalità riordino: gestita dal genitore via props sortMode/setSortMode

            React.useEffect(() => {
                setCats(getCategoriesFromStorage());
            }, []);

		    const orderKey = mode === 'income' ? 'categoryOrder_income' : 'categoryOrder';

		    React.useEffect(() => {
		        const savedOrder = localStorage.getItem(orderKey);
                if (savedOrder) {
                    setCategoryOrder(JSON.parse(savedOrder));
                } else {
		            setCategoryOrder((cats[mode] || []).map(c => c.id));
                }
		    }, [orderKey, mode]);

		    React.useEffect(() => {
		        if (categoryOrder.length > 0) {
		            localStorage.setItem(orderKey, JSON.stringify(categoryOrder));
		        }
		    }, [categoryOrder, orderKey]);

		    const dataByCategory = expenses || {};
		    const primaryTotal = Object.values(dataByCategory).reduce((acc, val) => acc + val, 0);
		    const totalBudget = mode === 'expense' ? Object.values(budgets || {}).reduce((acc, val) => acc + val, 0) : 0;

		    const activeCats = (cats[mode] || []).filter(c => !c.archived);
		    const archivedCats = (cats[mode] || []).filter(c => c.archived);

            // Ordina le categorie attive
		    const orderedCategories = categoryOrder
		        .map(id => activeCats.find(c => c.id === id))
		        .filter(Boolean);
            activeCats.forEach(cat => {
                if (!categoryOrder.includes(cat.id)) orderedCategories.push(cat);
            });

            // Archivia/ripristina categoria
		    const toggleArchive = (catId) => {
		        const updated = getCategoriesFromStorage();
		        updated[mode] = (updated[mode] || []).map(c =>
		            c.id === catId ? { ...c, archived: !c.archived } : c
		        );
		        saveCategoriestoStorage(updated);
		        setCats(getCategoriesFromStorage());
		    };

		    const isIncomeMode = mode === 'income';
		    const primaryLabel = isIncomeMode ? 'Entrate' : 'Spese';
		    const primaryAmount = isIncomeMode ? totalIncome : totalExpense;
		    const secondaryLabel = isIncomeMode ? 'Spese' : 'Entrate';
		    const secondaryAmount = isIncomeMode ? totalExpense : totalIncome;

            // Desktop drag
            const handleDragStart = (e, categoryId) => {
                setDraggedItem(categoryId);
                e.dataTransfer.effectAllowed = 'move';
            };
            const handleDragOver = (e, targetId) => {
                e.preventDefault();
                setDragOverItem(targetId);
            };
            const handleDrop = (e, targetId) => {
                e.preventDefault();
                if (!draggedItem || draggedItem === targetId) { setDraggedItem(null); setDragOverItem(null); return; }
                const newOrder = [...(categoryOrder.length > 0 ? categoryOrder : orderedCategories.map(c => c.id))];
                const from = newOrder.indexOf(draggedItem);
                const to = newOrder.indexOf(targetId);
                if (from < 0 || to < 0) { setDraggedItem(null); setDragOverItem(null); return; }
                newOrder.splice(from, 1);
                newOrder.splice(to, 0, draggedItem);
                setCategoryOrder(newOrder);
                setDraggedItem(null);
                setDragOverItem(null);
            };

            // Touch drag (mobile)
            const handleTouchStart = (e, catId) => {
                touchDrag.current = { active: true, id: catId, startY: e.touches[0].clientY };
            };
            const handleTouchMove = (e) => {
                if (!touchDrag.current.active) return;
                e.preventDefault();
                touchDrag.current.currentY = e.touches[0].clientY;
                // Trova elemento sotto il tocco
                const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
                const card = el && el.closest('[data-catid]');
                if (card) setDragOverItem(card.dataset.catid);
            };
            const handleTouchEnd = () => {
                if (!touchDrag.current.active) return;
                const from = touchDrag.current.id;
                const to = dragOverItem;
                if (from && to && from !== to) {
                    const newOrder = [...(categoryOrder.length > 0 ? categoryOrder : orderedCategories.map(c => c.id))];
                    const fi = newOrder.indexOf(from);
                    const ti = newOrder.indexOf(to);
                    if (fi >= 0 && ti >= 0) {
                        newOrder.splice(fi, 1);
                        newOrder.splice(ti, 0, from);
                        setCategoryOrder(newOrder);
                    }
                }
                touchDrag.current = { active: false, id: null };
                setDraggedItem(null);
                setDragOverItem(null);
            };

                    {/* Categorie attive */}
                    <div className="categories-grid">
		            {orderedCategories.map(category => {
		                const amount = dataByCategory[category.id] || 0;
		                const budget = (mode === 'expense' && budgets) ? (budgets[category.id] || 0) : 0;
                            const exceeded = budget > 0 && amount > budget;
                            const remaining = budget - amount;
                            const isDragging = draggedItem === category.id;
                            const isOver = dragOverItem === category.id && !isDragging;

                            return (
                                <div
                                    key={category.id}
                                    data-catid={category.id}
                                    className="category-card"
                                    onClick={(e) => {
                                        if (sortMode) return;
                                        if (!catLongPressed.current) onCategoryClick && onCategoryClick(category, e);
                                    }}
                                    onTouchStart={(e) => {
                                        e.stopPropagation();
                                        catLongPressed.current = false;
                                        const t = e.touches[0];
                                        catPressPos.current = { x: t.clientX, y: t.clientY };
                                        if (sortMode) {
                                            handleTouchStart(e, category.id);
                                            return;
                                        }
                                        catPressTimer.current = setTimeout(() => {
                                            catLongPressed.current = true;
                                            if (navigator.vibrate) navigator.vibrate(40);
                                            onCategoryLongPress && onCategoryLongPress(category, e);
                                        }, 500);
                                    }}
                                    onTouchMove={(e) => {
                                        if (sortMode) { handleTouchMove(e); return; }
                                        const t = e.touches[0];
                                        const dx = Math.abs(t.clientX - catPressPos.current.x);
                                        const dy = Math.abs(t.clientY - catPressPos.current.y);
                                        if (dx > 5 || dy > 5) clearTimeout(catPressTimer.current);
                                    }}
                                    onTouchEnd={(e) => {
                                        clearTimeout(catPressTimer.current);
                                        if (sortMode) { handleTouchEnd(e); return; }
                                        // Il click viene gestito da onClick, qui blocchiamo solo il long-press
                                        if (catLongPressed.current) {
                                            e.preventDefault();
                                            e.stopPropagation();
                                        }
                                        catLongPressed.current = false;
                                    }}
                                    style={{
                                        opacity: isDragging ? 0.3 : 1,
                                        transform: isOver ? 'scale(1.06)' : sortMode ? 'scale(1.02)' : 'scale(1)',

                                </div>
                            );
