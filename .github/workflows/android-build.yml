name: Build MoneyTracker APK

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare www directory
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.ico www/ 2>/dev/null || true

      - name: Initialize Capacitor Android
        run: |
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: Set executable permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          # Generate keystore
          keytool -genkey -v \
            -keystore signing.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MoneyTracker,O=Franco,C=IT"

          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          ${ANDROID_HOME}/build-tools/*/zipalign -v -p 4 "$APK_PATH" MoneyTracker-aligned.apk
          ${ANDROID_HOME}/build-tools/*/apksigner sign \
            --ks signing.keystore \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out MoneyTracker.apk \
            MoneyTracker-aligned.apk
          rm -f signing.keystore MoneyTracker-aligned.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: MoneyTracker.apk
          retention-days: 30
